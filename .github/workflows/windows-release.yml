name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package version $expectedTag"
          }

      - name: Run frontend quality gate
        run: pnpm check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build installer and create GitHub Release
        id: tauri-release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Club Planner ${{ github.ref_name }}
          releaseBody: |
            Рекомендуемая загрузка — `Club-Planner_0.1.0_x64-setup.exe`.

            Переносимый вариант `Club-Planner_0.1.0_x64-portable.exe` не требует установки.
            Для проверки целостности скачайте `SHA256SUMS.txt`.

            Возможности, проверки и ограничение SmartScreen описаны в [примечаниях к версии](https://github.com/boozik3412/club-planner/blob/main/docs/RELEASE_NOTES_0.1.0.md).
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: Club-Planner_[version]_x64[setup].[ext]

      - name: Prepare portable executable and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assetDirectory = "release-assets"
          $portableName = "Club-Planner_${version}_x64-portable.exe"
          $installerName = "Club-Planner_${version}_x64-setup.exe"
          $sourceInstaller = "src-tauri/target/release/bundle/nsis/Club Planner_${version}_x64-setup.exe"

          New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
          Copy-Item "src-tauri/target/release/club-planner.exe" "$assetDirectory/$portableName"
          Copy-Item $sourceInstaller "$assetDirectory/$installerName"

          $installerHash = (Get-FileHash "$assetDirectory/$installerName" -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash "$assetDirectory/$portableName" -Algorithm SHA256).Hash
          @(
            "$installerHash  $installerName"
            "$portableHash  $portableName"
          ) | Set-Content "$assetDirectory/SHA256SUMS.txt" -Encoding utf8

      - name: Upload portable executable and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release upload "${{ github.ref_name }}" `
            "release-assets/Club-Planner_${version}_x64-portable.exe" `
            release-assets/SHA256SUMS.txt `
            --clobber
